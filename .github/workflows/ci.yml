name: Cerebro Zero CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev,web]'
      - name: Test suite
        run: python -m pytest -q
      - name: Package metadata
        run: python -m pip check

  e2e:
    name: E2E benchmark
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install project
        run: python -m pip install -e '.[dev,web]'
      - name: Run E2E benchmark
        run: python cli.py benchmark

  lint:
    name: Syntax lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install flake8
        run: python -m pip install flake8
      - name: Critical lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel metadata
        run: python -m pip install --no-deps dist/*.whl
      - name: Verify CLI
        run: cerebro-zero --version
      - uses: actions/upload-artifact@v4
        with:
          name: cerebro-zero-distribution
          path: dist/
          retention-days: 30
