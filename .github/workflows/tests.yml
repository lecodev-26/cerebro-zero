name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests en Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml pytest
      
      - name: Verificar importaciones
        run: |
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import yaml; print('PyYAML OK')"
          python -c "import pytest; print('pytest:', pytest.__version__)"
      
      - name: Test de Tensor
        run: python tests/test_tensor.py
      
      - name: Gradient checking (autograd verificado)
        run: python tests/test_gradient_check.py
      
      - name: Ejecutar pytest completo
        run: pytest tests/ -v --tb=short
      
      - name: Resumen
        if: always()
        run: |
          echo "✅ Tests completados para Python ${{ matrix.python-version }}"
