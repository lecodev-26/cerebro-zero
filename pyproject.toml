[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-zero"
version = "4.0.0"
description = "Autonomous Learning Cognitive Agent — IA desde cero en Python + NumPy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Manuel", email = "axiomsystemsechepares@gmail.com"},
]
keywords = ["ai", "machine-learning", "numpy", "from-scratch", "cognitive-agent", "transformer", "autograd", "memory", "planning", "reinforcement-learning", "tokenizer", "bpe", "termux", "android"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.0,<3",
    "rich>=15.0",
    "tqdm>=4.70",
    "pillow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
web = [
    "flask>=2.0",
]

[project.urls]
Homepage = "https://github.com/lecodev-26/cerebro-zero"
Repository = "https://github.com/lecodev-26/cerebro-zero"
Issues = "https://github.com/lecodev-26/cerebro-zero/issues"

[project.scripts]
cerebro-zero = "cli:main"

[tool.setuptools]
packages = [
    "agent",
    "config",
    "core",
    "evaluation",
    "language",
    "memory",
    "mobile",
    "models",
    "reasoning",
    "security",
    "tools",
    "tools.plugins",
    "training",
    "utils",
]
py-modules = ["cli"]

[tool.setuptools.package-data]
config = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
