[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-zero"
version = "3.0.0"
description = "Autonomous Learning Cognitive Agent — IA desde cero en Python + NumPy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Manuel", email = "axiomsystemsechepares@gmail.com"},
]
keywords = ["ai", "machine-learning", "numpy", "from-scratch", "cognitive-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
web = [
    "flask>=2.0",
]

[project.urls]
Homepage = "https://github.com/lecodev-26/cerebro-zero"
Repository = "https://github.com/lecodev-26/cerebro-zero"
Issues = "https://github.com/lecodev-26/cerebro-zero/issues"

[project.scripts]
cerebro-zero = "cli:main"

[tool.setuptools]
packages = [
    "agent",
    "config",
    "core",
    "dashboard",
    "datasets",
    "evaluation",
    "experiments",
    "language",
    "memory",
    "mobile",
    "models",
    "reasoning",
    "security",
    "tools",
    "training",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
